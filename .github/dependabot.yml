# Dependabot config for the Bitvulnex lab.
#
# IMPORTANT: this is a DELIBERATELY VULNERABLE training app. Several
# dependencies are pinned to old/vulnerable versions ON PURPOSE and are
# tracked in VULNS.md (e.g. V-15 xml2js@0.4.23 / CVE-2023-0842, V-49
# dependency-confusion artifact @bvbe-internal/observability). The whole
# dependency graph is curated for the lab.
#
# Version-update PRs are therefore NOISE here: they fight the intentional
# pins, would break the app on major bumps (express 5, prisma 7, etc.),
# and can never be merged. We disable them (open-pull-requests-limit: 0)
# and additionally `ignore` the documented planted packages so security
# updates do not reopen them either. Security advisories remain visible in
# the repo Security tab for instructional purposes.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # 0 = do not open version-update PRs (the lab's deps are curated).
    open-pull-requests-limit: 0
    ignore:
      # Planted, intentional — do not let Dependabot "fix" these.
      - dependency-name: "xml2js"           # V-15 (CVE-2023-0842)
      - dependency-name: "@bvbe-internal/*"  # V-49 dependency-confusion artifact
