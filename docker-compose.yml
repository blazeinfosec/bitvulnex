# BVBE local lab — seven services.
#
# DO NOT DEPLOY. Local docker-compose only. `docker compose down -v`
# fully destroys all state. No volumes survive a reset.

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - bvbe-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://bvbe:bvbe@db:5432/bvbe?schema=public
      REDIS_URL: redis://redis:6379
      # Phase 0: strict, no fallback. The deliberate weak-key fallback
      # path that becomes V-9 is reserved for Phase 1. If JWT_SECRET is
      # unset, the web container must fail-fast at env() parsing.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (>=32 chars). Copy .env.example to .env.}
      BITCOIN_MOCK_URL: http://bitcoin-mock:18443
      CTF_MODE: ${CTF_MODE:-false}
      HINT_MODE: ${HINT_MODE:-false}
      SCOREBOARD_ENABLED: ${SCOREBOARD_ENABLED:-false}
      CTF_SALT: ${CTF_SALT:?CTF_SALT must be set. Copy .env.example to .env.}
    volumes:
      # Bind mounts so `next dev` Fast Refresh sees host edits.
      # The anonymous-volume entries for node_modules / .next prevent
      # the host OS file layer from contending with the container's.
      - ./apps/web:/repo/apps/web
      - ./packages:/repo/packages
      - ./CHANGELOG.md:/repo/CHANGELOG.md:ro
      - /repo/apps/web/node_modules
      - /repo/apps/web/.next
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      bitcoin-mock:
        condition: service_started
    networks:
      - bvbe-net

  # One-shot service: applies Prisma migrations and seeds the admin
  # row, then exits. `web` waits on `service_completed_successfully`
  # so exit criterion #6 ("admin row exists after `make up`") is
  # satisfied by `make up` alone.
  db-migrate:
    build:
      context: .
      dockerfile: apps/db-migrate/Dockerfile
    environment:
      DATABASE_URL: postgresql://bvbe:bvbe@db:5432/bvbe?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - bvbe-net

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://bvbe:bvbe@db:5432/bvbe?schema=public
      REDIS_URL: redis://redis:6379
      BITCOIN_MOCK_URL: http://bitcoin-mock:18443
    volumes:
      - ./apps/worker:/repo/apps/worker
      - ./packages:/repo/packages
      - /repo/apps/worker/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - bvbe-net

  bitcoin-mock:
    build:
      context: .
      dockerfile: apps/bitcoin-mock/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "18443"
    volumes:
      - ./apps/bitcoin-mock:/repo/apps/bitcoin-mock
      - ./packages/bitcoin-rpc-types:/repo/packages/bitcoin-rpc-types
      - /repo/apps/bitcoin-mock/node_modules
    # No host port mapping — internal network only.
    networks:
      - bvbe-net

  mock-imds:
    build:
      context: .
      dockerfile: apps/mock-imds/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "80"
    volumes:
      - ./apps/mock-imds:/repo/apps/mock-imds
      - /repo/apps/mock-imds/node_modules
    networks:
      bvbe-net:
        # Pose as the AWS EC2 metadata endpoint so CHAIN D's
        # SSRF-to-IAM-creds step has a target reachable by IP literal.
        aliases:
          - imds.bvbe.local
        ipv4_address: 169.254.169.254

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bvbe
      POSTGRES_PASSWORD: bvbe
      POSTGRES_DB: bvbe
    volumes:
      - bvbe-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bvbe -d bvbe"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
      - bvbe-net

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks:
      - bvbe-net

volumes:
  bvbe-db:

networks:
  bvbe-net:
    driver: bridge
    ipam:
      driver: default
      config:
        # Carved subnet inside the link-local /16 so the mock-imds
        # container can take the canonical 169.254.169.254 address.
        - subnet: 169.254.169.0/24
