worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    upstream web {
        server web:3000;
    }

    server {
        listen 80;
        server_name exchange.local localhost;

        # Phase 0 baseline proxying. Strict HTTP/1.1 semantics.
        # NOTE for later phases:
        #   - Phase 4 will add a proxy_cache zone scoped to /api/public/*
        #     (deliberate cache-poisoning surface for CHAIN C).
        #   - Phase 9 will activate a CL/TE-tolerant block reserved for
        #     request smuggling (CHAIN B). Phase 0 keeps both inert.

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
